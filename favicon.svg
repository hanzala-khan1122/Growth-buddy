<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="gbGrad" x1="4" y1="44" x2="44" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded box -->
  <rect width="48" height="48" rx="12" fill="#0B0F19" />
  <rect width="48" height="48" rx="12" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <!-- Growth Nexus Graphic -->
  <path d="M12 34 L22 22 L28 27 L36 14" stroke="url(#gbGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Arrow head -->
  <path d="M29 14 H36 V21" stroke="url(#gbGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- AI Neural Nodes -->
  <circle cx="12" cy="34" r="3" fill="#4F46E5" />
  <circle cx="22" cy="22" r="3" fill="#06B6D4" />
  <circle cx="28" cy="27" r="3" fill="#3B82F6" />
  <circle cx="36" cy="14" r="3.5" fill="#10B981" />
</svg>
